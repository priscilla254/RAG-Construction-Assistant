paths:
  raw_dir: data/raw
  cleaned_dir: data/cleaned
  chunks_path: data/chunks.jsonl
  chroma_dir: data/chroma_db
  manifest_path: manifest.csv

chunking:
  # Measured in words.
  chunk_size: 400
  chunk_overlap: 60

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  batch_size: 64

retrieval:
  k: 5
  vector_weight: 0.7
  keyword_weight: 0.3

generation:
  provider: groq
  model_name: openai/gpt-oss-20b
  temperature: 0.1
  max_tokens: 1024
  # true = every retrieved passage (debug). Streamlit defaults to cited-only.
  show_all_sources: true
